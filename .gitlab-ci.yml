stages:
  - build
  - publish
  - pages

variables:
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  BUILD_DIR: build
  OSTREE_REPO: ostree-repo
  PAGES_URL: https://saurov.local-kde.org/transistor
  #GPG_KEY_ID: A848845C4A4919DFF5F7235AC3187031755F7D54
  #GPG_PUBLIC_FILE: public-key.gpg

# ------------------------------
# Stage 1: сборка Flatpak
# ------------------------------
build-flatpak:
  stage: build
  tags:
    - kde-sdk
  script:
    - echo "Создание build директории..."
    - rm -rf $BUILD_DIR
    - mkdir -p $BUILD_DIR
    - flatpak-builder --force-clean $BUILD_DIR .flatpak-manifest.json
  artifacts:
    paths:
      - $BUILD_DIR

# ------------------------------
# Stage 2: публикация OSTree репозитория
# ------------------------------
publish-repo:
  stage: publish
  tags:
    - kde-sdk
  dependencies:
    - build-flatpak   # строго зависит от build-flatpak
  script:
    - echo "Создание OSTree репозитория..."
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2 || true
    - flatpak build-export $OSTREE_REPO $BUILD_DIR
    - flatpak build-update-repo $OSTREE_REPO

    - echo "Копирование репозитория в Pages..."
    - mkdir -p public/repo
    - cp -r $OSTREE_REPO/* public/repo/
    #- echo "Экспорт публичного GPG ключа для Flatpak..."
    #- gpg --armor --export $GPG_KEY_ID > public/$GPG_PUBLIC_FILE
    - echo "Генерация .flatpakrepo..."
    - mkdir -p public
    - echo "[Flatpak Repo]" > public/$APP_ID.flatpakrepo
    - echo "Title=$APP_NAME" >> public/$APP_ID.flatpakrepo
    - echo "Url=$PAGES_URL/repo" >> public/$APP_ID.flatpakrepo
    - echo "Homepage=https://invent.kde.org/saurov/transistor" >> public/$APP_ID.flatpakrepo
    # - echo "GPGVerify=false" >> public/$APP_ID.flatpakrepo
    - echo "[Application]" > public/$APP_ID.flatpakref
    - echo "Name=$APP_NAME" >> public/$APP_ID.flatpakref
    - echo "Id=$APP_ID" >> public/$APP_ID.flatpakref
    - echo "Runtime=org.kde.Platform/x86_64/6.9" >> public/$APP_ID.flatpakref
    - echo "Sdk=org.kde.Sdk/x86_64/6.9" >> public/$APP_ID.flatpakref
    - echo "Branch=stable" >> public/$APP_ID.flatpakref
    - echo "Url=$PAGES_URL/repo" >> public/$APP_ID.flatpakref
    - echo "Homepage=https://invent.kde.org/saurov/transistor" >> public/$APP_ID.flatpakref
    #- echo "GPGKey=$PAGES_URL/public-key.gpg" >> public/$APP_ID.flatpakref


  artifacts:
    paths:
      - public

# ------------------------------
# Stage 3: деплой на Pages
# ------------------------------
pages:
  stage: pages
  tags:
    - kde-sdk
  dependencies:
    - publish-repo   # строго зависит от publish-repo
  script:
    - echo "Deploying Pages..."
  artifacts:
    paths:
      - public
  only:
    - master   # или main
