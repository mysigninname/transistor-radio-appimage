stages:
  - build
  - publish
  - pages

variables:
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  BUILD_DIR: build
  OSTREE_REPO: ostree-repo
  PAGES_URL: https://saurov.local-kde.org/transistor

# ------------------------------
# Stage 1: сборка Flatpak
# ------------------------------
build-flatpak:
  stage: build
  tags:
    - kde-sdk
  script:
    - echo "Создание build директории..."
    - rm -rf "$BUILD_DIR" "$OSTREE_REPO" public
    - mkdir -p $BUILD_DIR
    - flatpak-builder --force-clean $BUILD_DIR .flatpak-manifest.json
  artifacts:
    paths:
      - $BUILD_DIR

# ------------------------------
# Stage 2: публикация OSTree репозитория
# ------------------------------
publish-repo:
  stage: publish
  tags:
    - kde-sdk
  dependencies:
    - build-flatpak   # строго зависит от build-flatpak
  script:
    - echo "Создание OSTree репозитория..."
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2 || true
    - flatpak build-export $OSTREE_REPO $BUILD_DIR
    # ---- GPG setup ----
    - mkdir -p ~/.gnupg
    - echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
    - gpg-connect-agent reloadagent /bye

    - gpg --import --batch "$GPG_PRIVATE_KEY"
    # ---- inline GPG public key for flatpakrepo ----
    - GPG_KEY_INLINE=$(gpg --export --armor "$GPG_KEY_ID" | sed -e '/^-----BEGIN/d' -e '/^-----END/d' -e '/^=/d' | tr -d '\n')


    - echo "$GPG_PASSPHRASE" | /usr/lib/gnupg/gpg-preset-passphrase --preset "$GPG_KEY_GRIP"
    - gpg-connect-agent "KEYINFO $GPG_KEY_GRIP" /bye

    - flatpak build-update-repo "$OSTREE_REPO" \
        --gpg-sign="$GPG_KEY_ID" \
        --generate-static-deltas \
        --gpg-verify-summary=false

    - echo "Копирование репозитория в Pages..."
    - mkdir -p public/repo
    - cp -r $OSTREE_REPO/* public/repo/

    - |
      echo "Exporting public GPG key…"
      gpg --export --armor "$GPG_KEY_ID" > public/repo-public.key
      cat public/repo-public.key
    
    # ---- flatpakrepo ----
    - |
      cat > public/$APP_ID.flatpakrepo <<EOF
      [Flatpak Repo]
      Name=$APP_ID
      Title=$APP_NAME
      Url=$PAGES_URL/repo/
      Homepage=https://invent.kde.org/saurov/transistor/
      GPGVerify=true
      GPGVerifySummary=false
      EOF

    # ---- flatpakref ----
    - |
      cat > public/$APP_ID.flatpakref <<EOF
      [Flatpak Ref]
      Name=ru.transistor_radio.transistor
      Title=Transistor
      Comment=Internet Radio Player
      Icon=https://transistor-radio.ru/assets/img/ru.transistor_radio.transistor.svg
      Branch=master
      RuntimeRepo=https://saurov.local-kde.org/transistor/ru.transistor_radio.transistor.flatpakrepo
      IsRuntime=false
      Url=https://invent.kde.org/saurov/transistor/
      EOF


  artifacts:
    paths:
      - public

# ------------------------------
# Stage 3: деплой на Pages
# ------------------------------
pages:
  stage: pages
  tags:
    - kde-sdk
  dependencies:
    - publish-repo   # строго зависит от publish-repo
  script:
    - echo "Deploying Pages..."
  artifacts:
    paths:
      - public
  only:
    - master   # или main
