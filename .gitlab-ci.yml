stages:
  - build
  - publish
  - pages

variables:
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  BUILD_DIR: build
  OSTREE_REPO: ostree-repo
  PAGES_URL: https://saurov.local-kde.org/transistor

# ------------------------------
# Stage 1: сборка Flatpak
# ------------------------------
build-flatpak:
  stage: build
  tags:
    - kde-sdk
  script:
    - echo "Создание build директории..."
    - rm -rf "$BUILD_DIR" "$OSTREE_REPO" public
    - mkdir -p $BUILD_DIR
    - flatpak-builder --force-clean $BUILD_DIR .flatpak-manifest.json
  artifacts:
    paths:
      - $BUILD_DIR

# ------------------------------
# Stage 2: публикация OSTree репозитория с GPG (без пароля)
# ------------------------------
publish-repo:
  stage: publish
  tags:
    - kde-sdk
  dependencies:
    - build-flatpak
  before_script:
    # Настраиваем GPG для CI - ключ БЕЗ ПАРОЛЯ
    - mkdir -p ~/.gnupg
    - chmod 700 ~/.gnupg
    
    # Отладка: проверяем, что переменная существует
    #- echo "Длина GPG_PRIVATE_KEY: ${#GPG_PRIVATE_KEY}"
    
    # Импортируем приватный ключ в ASCII-armor формате
    # (проще для отладки, чем base64)
    - |
      if [ -n "$GPG_PRIVATE_KEY" ]; then
        echo "Импортируем GPG ключ..."
        # echo "$GPG_PRIVATE_KEY" > tmp/private.asc
        gpg --batch --import $GPG_PRIVATE_KEY
        # GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)
        echo "Используем GPG ключ: $GPG_KEY_ID"
        # Проверяем, что ключ без пароля
        echo "test" | gpg --batch --clear-sign --local-user $GPG_KEY_ID > /dev/null 2>&1
        if [ $? -eq 0 ]; then
          echo "✓ Ключ без пароля работает"
        else
          echo "⚠ Возможны проблемы с ключом"
        fi
      else
        echo "⚠ GPG ключ не задан. Создаем неподписанный репозиторий."
        GPG_KEY_ID=""
      fi
  script:
    - echo "Создание OSTree репозитория..."
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2
    
    # Экспорт сборки
    - flatpak build-export $OSTREE_REPO $BUILD_DIR

    # Обновление репозитория (с подписью или без)
    - |
      if [ -n "$GPG_KEY_ID" ]; then
        echo "Обновляем репозиторий С подписью..."
        flatpak build-update-repo $OSTREE_REPO \
          --generate-static-deltas \
          --gpg-sign=$GPG_KEY_ID \
          --gpg-homedir=~/.gnupg
      else
        echo "Обновляем репозиторий БЕЗ подписи..."
        flatpak build-update-repo $OSTREE_REPO \
          --generate-static-deltas \
          --no-gpg-verify
      fi

    # ---- Копирование для Pages ----
    - mkdir -p public/repo
    - cp -r $OSTREE_REPO/* public/repo/

    # ---- Создание файлов репозитория ----
    - |
      if [ -n "$GPG_KEY_ID" ]; then
        GPG_KEY_BASE64=$(gpg --export $GPG_KEY_ID | base64 -w0)

        - cat > $APP_ID.flatpakrepo <<EOF
        [Flatpak Repo]
        Title=$APP_NAME
        Url=$PAGES_URL/repo
        Homepage=https://invent.kde.org/saurov/transistor/
        Comment=Internet Radio Player
        Description=Repository for $APP_NAME application
        GPGKey=$GPG_KEY_BASE64
        EOF
        gpg --batch --detach-sign --armor $APP_ID.flatpakrepo
        - cat > public/$APP_ID.flatpakref <<EOF
        [Flatpak Ref]
        Name=$APP_ID
        Title=$APP_NAME
        Comment=Internet Radio Player
        Icon=https://transistor-radio.ru/assets/img/ru.transistor_radio.transistor.svg
        Branch=master
        RuntimeRepo=$PAGES_URL/$APP_ID.flatpakrepo
        IsRuntime=false
        Url=$PAGES_URL/repo
        GPGKey=$GPG_KEY_BASE64
        EOF
        gpg --export --armor $GPG_KEY_ID > public/repo.gpg
        mv $APP_ID.flatpakrepo $APP_ID.flatpakrepo.asc public/
        echo "✓ Репозиторий подписан"
      else
        - cat > public/$APP_ID.flatpakrepo <<EOF
        [Flatpak Repo]
        Title=$APP_NAME
        Url=$PAGES_URL/repo
        Homepage=https://invent.kde.org/saurov/transistor/
        Comment=Internet Radio Player
        Description=Repository for $APP_NAME application
        GPGVerify=false
        EOF
        - cat > public/$APP_ID.flatpakref <<EOF
        [Flatpak Ref]
        Name=$APP_ID
        Title=$APP_NAME
        Comment=Internet Radio Player
        Icon=https://transistor-radio.ru/assets/img/ru.transistor_radio.transistor.svg
        Branch=master
        RuntimeRepo=$PAGES_URL/$APP_ID.flatpakrepo
        IsRuntime=false
        Url=$PAGES_URL/repo
        GPGVerify=false
        EOF
        echo "⚠ Репозиторий без подписи (для тестирования)"
      fi

    # ---- Проверка (если есть подпись) ----
    - |
      if [ -n "$GPG_KEY_ID" ]; then
        echo "Проверка подписи..."
        if [ -f public/$APP_ID.flatpakrepo.asc ]; then
          gpg --verify public/$APP_ID.flatpakrepo.asc public/$APP_ID.flatpakrepo && echo "✓ Подпись .flatpakrepo верна"
        fi
        echo "Публичный ключ сохранен в: $PAGES_URL/repo.gpg"
      fi

  artifacts:
    paths:
      - public
    expire_in: 1 week

# ------------------------------
# Stage 3: деплой на Pages
# ------------------------------
pages:
  stage: pages
  tags:
    - kde-sdk
  dependencies:
    - publish-repo
  script:
    - echo "Deploying Pages..."
  artifacts:
    paths:
      - public
  only:
    - master