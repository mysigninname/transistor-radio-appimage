# .gitlab-ci.yml
# CI/CD для сборки и публикации Flatpak Transistor на host runner (shell executor)

stages:
  - build
  - publish
  - pages

variables:
  BUILD_DIR: build-dir
  OSTREE_REPO: flatpak-repo/repo
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  PAGES_URL: "https://invent.kde.org/saurov/transistor/-/raw/main/flatpak-repo/repo"

before_script:
  # Проверяем, что на host установлены необходимые инструменты
  - flatpak-builder --version || echo "Установите flatpak-builder на runner"
  - cmake --version || echo "Установите cmake на runner"
  - ninja --version || echo "Установите ninja на runner"
  - which qmake || echo "Установите Qt6 на runner"
  - which kirigami || echo "Установите KF6/Kirigami dev libs на runner"

# --------------------------
# 1️⃣ Сборка Flatpak
# --------------------------
build-flatpak:
  stage: build
  script:
    - rm -rf $BUILD_DIR
    - mkdir -p $BUILD_DIR
    - flatpak-builder --force-clean $BUILD_DIR $APP_ID.json
    - ls $BUILD_DIR/share/applications/
    - ls $BUILD_DIR/share/metainfo/
    - ls $BUILD_DIR/share/icons/hicolor/scalable/apps/
  artifacts:
    paths:
      - $BUILD_DIR
  only:
    - main

# --------------------------
# 2️⃣ Создание репозитория и .flatpakrepo
# --------------------------
publish-repo:
  stage: publish
  dependencies:
    - build-flatpak
  script:
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2 || true
    - flatpak build-export $OSTREE_REPO $BUILD_DIR
    - flatpak build-update-repo $OSTREE_REPO
    - mkdir -p public
    - echo "[Flatpak Repo]" > public/$APP_ID.flatpakrepo
    - echo "Title=$APP_NAME" >> public/$APP_ID.flatpakrepo
    - echo "Url=$PAGES_URL" >> public/$APP_ID.flatpakrepo
    - echo "Homepage=https://invent.kde.org/saurov/transistor" >> public/$APP_ID.flatpakrepo
  artifacts:
    paths:
      - public
  only:
    - main

# --------------------------
# 3️⃣ Публикация на invent.kde.org Pages
# --------------------------
pages:
  stage: pages
  dependencies:
    - publish-repo
  script:
    - mv public public_pages
  artifacts:
    paths:
      - public_pages
  only:
    - main
