# .gitlab-ci.yml
# CI/CD для сборки Flatpak Transistor на host runner (shell executor) и публикации через Pages

stages:
  - build
  - publish
  - pages

variables:
  BUILD_DIR: build-dir
  OSTREE_REPO: flatpak-repo/repo
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  PAGES_URL: "https://invent.kde.org/saurov/transistor/-/raw/main/flatpak-repo/repo"

# --------------------------
# 1️⃣ Сборка Flatpak
# --------------------------
build-flatpak:
  stage: build
  tags:
    - kde-sdk   # тег для host runner
  script:
    - echo "Сборка Flatpak..."
    - rm -rf $BUILD_DIR
    - mkdir -p $BUILD_DIR
    - flatpak-builder --force-clean $BUILD_DIR .flatpak-manifest.json
  artifacts:
    paths:
      - $BUILD_DIR

# --------------------------
# 2️⃣ Создание репозитория и .flatpakrepo
# --------------------------
publish-repo:
  stage: publish
  tags:
    - kde-sdk
  dependencies:
    - build-flatpak
  script:
    - echo "Создание OSTree репозитория..."
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2 || true
    - flatpak build-export $OSTREE_REPO $BUILD_DIR
    - flatpak build-update-repo $OSTREE_REPO

    - echo "Генерация .flatpakrepo для Pages..."
    - mkdir -p public
    - echo "[Flatpak Repo]" > public/$APP_ID.flatpakrepo
    - echo "Title=$APP_NAME" >> public/$APP_ID.flatpakrepo
    - echo "Url=$PAGES_URL/repo" >> public/$APP_ID.flatpakrepo
    - echo "Homepage=https://invent.kde.org/saurov/transistor" >> public/$APP_ID.flatpakrepo
    - echo "GPGVerify=false" >> public/$APP_ID.flatpakrepo

  artifacts:
    paths:
      - public

# --------------------------
# 3️⃣ Публикация на Pages
# --------------------------
pages:
  stage: pages
  tags:
    - kde-sdk
  dependencies:
    - publish-repo
  script:
    - echo "Подготовка артефактов для Pages..."
  artifacts:
    paths:
      - public
