# .gitlab-ci.yml
# CI/CD для сборки и публикации Flatpak Transistor на invent.kde.org (host SDK)

stages:
  - build
  - publish
  - pages

variables:
  BUILD_DIR: build-dir
  OSTREE_REPO: flatpak-repo/repo
  APP_ID: ru.transistor_radio.transistor
  APP_NAME: Transistor
  PAGES_URL: "https://invent.kde.org/saurov/transistor/-/raw/main/flatpak-repo/repo"

# --------------------------
# 1️⃣ Сборка Flatpak
# --------------------------
build-flatpak:
  stage: build
  script:
    # Чистим старую сборку
    - rm -rf $BUILD_DIR
    - mkdir -p $BUILD_DIR
    # Собираем приложение через flatpak-builder
    - flatpak-builder --force-clean $BUILD_DIR $APP_ID.json
    # Проверяем, что .desktop, metainfo и icon на месте
    - ls $BUILD_DIR/share/applications/
    - ls $BUILD_DIR/share/metainfo/
    - ls $BUILD_DIR/share/icons/hicolor/scalable/apps/
  artifacts:
    paths:
      - $BUILD_DIR
  tags:
    - LargeVM amd64 # тег runner, указывающий на self-hosted runner с host SDK

# --------------------------
# 2️⃣ Создание репозитория и .flatpakrepo
# --------------------------
publish-repo:
  stage: publish
  dependencies:
    - build-flatpak
  script:
    # Инициализация ostree репозитория
    - mkdir -p $OSTREE_REPO
    - ostree init --repo=$OSTREE_REPO --mode=archive-z2 || true
    # Экспортируем сборку в ostree репозиторий
    - flatpak build-export $OSTREE_REPO $BUILD_DIR
    - flatpak build-update-repo $OSTREE_REPO
    # Создание .flatpakrepo для пользователей
    - mkdir -p public
    - echo "[Flatpak Repo]" > public/$APP_ID.flatpakrepo
    - echo "Title=$APP_NAME" >> public/$APP_ID.flatpakrepo
    - echo "Url=$PAGES_URL" >> public/$APP_ID.flatpakrepo
    - echo "Homepage=https://invent.kde.org/saurov/transistor" >> public/$APP_ID.flatpakrepo
  artifacts:
    paths:
      - public
  only:
    - main
  tags:
    - LargeVM amd64

# --------------------------
# 3️⃣ Публикация на invent.kde.org Pages
# --------------------------
pages:
  stage: pages
  dependencies:
    - publish-repo
  script:
    # GitLab Pages ожидает папку public/
    - mv public public_pages
  artifacts:
    paths:
      - public_pages
  only:
    - main
  tags:
    - LargeVM amd64
