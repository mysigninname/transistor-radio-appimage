name: Build AnyLinux AppImage (sharun/quick-sharun) - x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file jq \
            build-essential pkg-config cmake \
            gcc g++ \
            libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev \
            libudev-dev libusb-1.0-0-dev \
            desktop-file-utils \
            squashfs-tools fuse3

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build workspace
        run: |
          mkdir -p work dist
          cd work
          echo "ARCH=$(uname -m)" > arch.env

      - name: Download release artifacts (source-free fallback)
        id: release_artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "No tag build; will build from repo sources."
            echo "mode=build_from_source" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=download_assets" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

          # Best-effort: try to download an existing Linux binary asset from the release.
          # Adjust patterns if your release uses different filenames.
          api="https://api.github.com/repos/dyedfox/dyedfox-radio/releases/tags/${TAG}"
          rel="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" "$api")"

          # Try to find likely Linux assets.
          urls=()
          names=()
          while IFS= read -r row; do
            url="$(jq -r '.browser_download_url' <<<"$row")"
            name="$(jq -r '.name' <<<"$row")"
            urls+=("$url")
            names+=("$name")
          done < <(jq -c '.assets[] | select(.name|test("(?i)(linux|x86_64|amd64)"))' <<<"$rel")

          # If none found, fall back to building from source.
          if [[ "${#urls[@]}" -eq 0 ]]; then
            echo "No matching Linux/x86_64 assets found; building from source."
            echo "mode=build_from_source" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found candidate assets:"
          for i in "${!urls[@]}"; do
            echo "  - ${names[$i]}"
          done

          mkdir -p work/assets
          for i in "${!urls[@]}"; do
            curl -L --fail -o "work/assets/${names[$i]}" "${urls[$i]}"
          done

      - name: Build from source (if needed)
        if: steps.release_artifacts.outputs.mode == 'build_from_source'
        run: |
          set -euo pipefail
          cd work

          # If the project has build instructions, keep this generic.
          # Common patterns: Cargo, CMake, or generic Makefile.
          # If you already know the build system for dyedfox-radio, replace this block accordingly.
          if [[ -f ../Cargo.toml ]]; then
            rustup show >/dev/null 2>&1 || true
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends curl ca-certificates
            if ! command -v cargo >/dev/null 2>&1; then
              curl https://sh.rustup.rs -sSf | sh -s -- -y
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            fi
            cargo build --release
            # Assume binary in target/release
            binpath="$(find ../target/release -maxdepth 1 -type f -executable -print | head -n 1)"
            cp "$binpath" ./dyedfox-radio.bin
          elif [[ -f ../CMakeLists.txt ]]; then
            sudo apt-get install -y --no-install-recommends ninja-build
            mkdir -p build && cd build
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ../
            ninja
            binpath="$(find . -maxdepth 3 -type f -executable -print | head -n 1)"
            cp "$binpath" ../../dyedfox-radio.bin
          else
            # Generic: try make
            if [[ -f ../Makefile || -f ../makefile ]]; then
              make -j"$(nproc)" -C ../
              binpath="$(find ../ -maxdepth 2 -type f -executable -print | head -n 1)"
              cp "$binpath" ./dyedfox-radio.bin
            else
              echo "Could not determine build system. Provide prebuilt binary asset or update workflow."
              exit 1
            fi
          fi

      - name: Select binary to bundle
        id: select_bin
        run: |
          set -euo pipefail
          cd work

          # If downloaded assets exist, pick the most plausible executable.
          if [[ -d assets ]]; then
            cand="$(find assets -type f -executable | head -n 1 || true)"
            if [[ -n "${cand}" ]]; then
              cp "$cand" ./dyedfox-radio.bin
            fi
          fi

          if [[ ! -f ./dyedfox-radio.bin ]]; then
            echo "dyedfox-radio.bin not found; ensure the repository has a Linux executable or release assets are downloadable."
            exit 1
          fi

          chmod +x ./dyedfox-radio.bin
          echo "bin=./work/dyedfox-radio.bin" >> "$GITHUB_OUTPUT"

      - name: Setup quick-sharun
        run: |
          set -euo pipefail
          cd work
          SHARUN_URL="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"
          curl -L --fail "$SHARUN_URL" -o ./quick-sharun.sh
          chmod +x ./quick-sharun.sh

      - name: Create .desktop + icon placeholders (optional)
        run: |
          set -euo pipefail
          cd work
          mkdir -p appdir/share/icons/hicolor/256x256/apps
          # Placeholder icon: create a minimal empty file if not present.
          # Replace with real icon from repo if available.
          : > appdir/share/icons/hicolor/256x256/apps/dyedfox-radio.png

          cat > appdir/share/applications/dyedfox-radio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dyedfox Radio
          Exec=dyedfox-radio
          Icon=dyedfox-radio
          Categories=AudioVideo;Audio;
          EOF

      - name: Run quick-sharun and build AppImage
        env:
          OUTPATH: dist
          OUTNAME: dyedfox-radio-x86_64-${{ steps.ver.outputs.version }}.AppImage
          # quick-sharun uses these env vars if you set them.
          ICON: /usr/share/icons/hicolor/256x256/apps/dyedfox-radio.png
          DESKTOP: /usr/share/applications/dyedfox-radio.desktop
        run: |
          set -euo pipefail
          cd work

          # Configure quick-sharun output dir/name
          export APPDIR="${APPDIR:-$PWD/AppDir}"
          export OUTPATH="${OUTPATH:-$PWD/dist}"
          export OUTNAME="${OUTNAME:-dyedfox-radio.AppImage}"

          # Ensure dist exists
          mkdir -p "$OUTPATH"

          # Bundle the binary. quick-sharun will generate AppDir and AppRun.
          # NOTE: Some projects need extra runtime assets (config/templates). Add them after inspecting your app.
          ./quick-sharun.sh ./dyedfox-radio.bin

          # quick-sharun usually accepts --make-appimage after bundling (as per guide).
          ./quick-sharun.sh --make-appimage

          # Move/rename output deterministically if needed.
          # If output name differs, keep it and re-list.
          echo "Listing dist:"
          ls -lah "$OUTPATH" || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: anylinux-appimage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Create/update GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
