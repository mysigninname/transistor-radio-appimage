name: Build dyedfox Radio AnyLinux AppImage (sharun/quick-sharun)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file jq \
            fuse3 squashfs-tools \
            desktop-file-utils \
            binutils \
            patchelf \
            libc6-dev \
            libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev \
            libasound2-dev libgl1-mesa-dev libudev-dev libusb-1.0-0-dev

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download quick-sharun
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -L --fail \
            "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh" \
            -o tools/quick-sharun.sh
          chmod +x tools/quick-sharun.sh

      - name: Fetch release binary (tag builds) or build (fallback)
        id: getbin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p work
          cd work

          # Always try release download first on tag builds
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            api="https://api.github.com/repos/dyedfox/dyedfox-radio/releases/tags/${TAG}"
            rel="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" "$api")"

            # Pick a likely Linux/x86_64 artifact
            # If your release assets are named differently, update the regex below.
            candidate="$(echo "$rel" | jq -r '
              .assets[]
              | select(.name|test("(?i)(linux|appimage|x86_64|amd64|tar|deb|tgz|gz|zip|bin)$"))
              | .browser_download_url
              ' | head -n 1)"

            if [[ -n "$candidate" && "$candidate" != "null" ]]; then
              echo "mode=download" >> "$GITHUB_OUTPUT"
              echo "url=$candidate" >> "$GITHUB_OUTPUT"
              echo "Downloading: $candidate"
              curl -L --fail "$candidate" -o release-artifact
            else
              echo "mode=build" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ steps.getbin.outputs.mode }}" == "download" ]]; then
            # Try to extract if it's an archive; otherwise treat as binary if executable.
            # (This is best-effort; adjust for your actual release asset type.)
            if file release-artifact | grep -qiE 'ELF'; then
              chmod +x release-artifact
              cp release-artifact ./dyedfox-radio.bin
            else
              # Attempt common archives
              mkdir -p extracted
              if file release-artifact | grep -qiE 'gzip'; then
                tar -xzf release-artifact -C extracted || true
              fi
              if file release-artifact | grep -qiE 'zip'; then
                sudo apt-get install -y --no-install-recommends unzip
                unzip -q release-artifact -d extracted || true
              fi
              if file release-artifact | grep -qiE 'tar'; then
                tar -xf release-artifact -C extracted || true
              fi

              binpath="$(find extracted -maxdepth 4 -type f -executable | head -n 1 || true)"
              if [[ -z "$binpath" ]]; then
                echo "Could not find an executable inside downloaded artifact."
                exit 1
              fi
              cp "$binpath" ./dyedfox-radio.bin
            fi
          else
            # Build from repository sources (fallback).
            # If dyedfox-radio isn't a Rust/Cargo project, replace this section with the correct build commands.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends curl

            if [[ -f Cargo.toml ]]; then
              if ! command -v cargo >/dev/null 2>&1; then
                curl https://sh.rustup.rs -sSf | sh -s -- -y
                echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              fi
              cargo build --release
              binpath="$(find target/release -maxdepth 1 -type f -executable | head -n 1)"
              cp "$binpath" ./dyedfox-radio.bin
            else
              echo "No Cargo.toml found and no downloadable binary asset matched. Update workflow build step for your project."
              exit 1
            fi
          fi

          chmod +x ./dyedfox-radio.bin
          test -x ./dyedfox-radio.bin

      - name: Create minimal AppDir structure (dyedfox Radio)
        run: |
          set -euo pipefail
          cd work

          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Place binary
          cp ./dyedfox-radio.bin AppDir/usr/bin/dyedfox-radio

          # Minimal icon placeholder (replace by adding real icon if available in repo)
          : > AppDir/usr/share/icons/hicolor/256x256/apps/dyedfox-radio.png

          cat > AppDir/usr/share/applications/dyedfox-radio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dyedfox Radio
          Exec=dyedfox-radio
          Icon=dyedfox-radio
          Categories=AudioVideo;Audio;
          EOF

      - name: Build AppImage using quick-sharun (output is Dyedfox Radio AppImage)
        env:
          OUTDIR: dist
          APPNAME: "Dyedfox Radio"
          OUTNAME: "dyedfox-radio-x86_64-${{ steps.ver.outputs.version }}.AppImage"
        run: |
          set -euo pipefail
          cd work

          mkdir -p "$OUTDIR"

          # Ensure quick-sharun uses the existing AppDir and wraps to AppImage.
          # If your quick-sharun expects different args, update call accordingly.
          # Common patterns: --appdir, --make-appimage, or env-based.
          #
          # We try the most common: provide AppDir path and make AppImage.
          ../tools/quick-sharun.sh ./AppDir

          # Force output naming by copying final AppImage to expected OUTNAME.
          # quick-sharun usually produces exactly one *.AppImage in the current directory or OUTDIR.
          # We'll search and rename deterministically.
          shopt -s nullglob
          candidates=( **/*.AppImage **/*AppImage *.AppImage )
          # Fallback: look in current/parent/dist
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            candidates=( dist/*.AppImage ../dist/*.AppImage )
          fi

          found=""
          for c in "${candidates[@]}"; do
            if [[ -f "$c" ]]; then
              found="$c"
              break
            fi
          done

          if [[ -z "$found" ]]; then
            echo "No AppImage produced by quick-sharun."
            echo "Workspace contents:"
            ls -Rlah .
            exit 1
          fi

          cp -f "$found" "../$OUTDIR/$OUTNAME"
          echo "Produced: ../$OUTDIR/$OUTNAME"
          ls -lah "../$OUTDIR/$OUTNAME"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyedfox-radio-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Create/update GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
