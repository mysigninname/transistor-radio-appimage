name: Build Transistor AnyLinux AppImage (sharun)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      REPO_SLUG: ${{ github.repository }}
      APP_NAME: transistor
      OUT_DIR: dist
      ARCH: x86_64
      CMAKE_BUILD_TYPE: Release
      # Upstream
      TRANSISTOR_REPO: gitlab.com/driglu4it/transistor.git

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git wget curl jq \
            build-essential ninja-build cmake pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            qt6-multimedia-dev qt6-multimedia-dev-tools \
            libqt6svg6-dev libqt6svg6-dev \
            libqt6quick-templates2-dev \
            libqt6quick6-dev \
            libasound2-dev \
            libpulse-dev \
            libssl-dev \
            zlib1g-dev \
            desktop-file-utils \
            librsvg2-dev \
            libxkbcommon-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev \
            libdrm-dev \
            mesa-common-dev

      - name: Install extra Qt tools (if needed)
        run: |
          sudo apt-get install -y --no-install-recommends qt6-l10n-tools || true

      - name: Build Transistor (from source)
        run: |
          set -euxo pipefail

          rm -rf transistor build
          git clone --depth 1 --recursive "https://$TRANSISTOR_REPO" transistor
          cd transistor

          mkdir -p build
          cd build

          cmake .. -GNinja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF

          ninja
          DESTDIR="$GITHUB_WORKSPACE/stage" ninja install

          echo "Installed files to: $GITHUB_WORKSPACE/stage"
          ls -la "$GITHUB_WORKSPACE/stage/usr" | head -n 50

      - name: Prepare AnyLinux AppImage using quick-sharun (sharun-based)
        run: |
          set -euxo pipefail

          mkdir -p "${OUT_DIR}"

          # Stash staging into a "fake root" (/usr layout) that quick-sharun can bundle.
          # quick-sharun is run with paths; it expects installed-to-/usr layout.
          STAGE_ROOT="$GITHUB_WORKSPACE/stage"
          export ICON="${STAGE_ROOT}/usr/share/icons/hicolor/256x256/apps/transistor.png"
          export DESKTOP="${STAGE_ROOT}/usr/share/applications/org.driglu4it.transistor.desktop"
          # Fallback icon/desktop detection if upstream file names differ
          if [ ! -f "$ICON" ]; then
            ICON="$(find "$STAGE_ROOT/usr/share/icons" -type f \( -name '*.png' -o -name '*.svg' \) | head -n 1 || true)"
            if [ -z "$ICON" ]; then
              ICON=/usr/share/icons/hicolor/256x256/apps/transistor.png
            fi
          fi
          if [ ! -f "$DESKTOP" ]; then
            DESKTOP="$(find "$STAGE_ROOT/usr/share/applications" -type f \( -name '*.desktop' \) | head -n 1 || true)"
            if [ -z "$DESKTOP" ]; then
              DESKTOP=/usr/share/applications/transistor.desktop
            fi
          fi

          export APPDIR="${GITHUB_WORKSPACE}/AppDir"
          export OUTPATH="${GITHUB_WORKSPACE}/${OUT_DIR}"
          export OUTNAME="${APP_NAME}-${{ github.ref_name }}-${ARCH}-anylinux.AppImage"
          export ADD_HOOKS="self-updater.bg.hook"

          SHARUN="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"
          URUNTIME="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/uruntime2appimage.sh"

          wget --retry-connrefused --tries=30 "$SHARUN" -O ./quick-sharun
          chmod +x ./quick-sharun

          wget --retry-connrefused --tries=30 "$URUNTIME" -O ./uruntime2appimage
          chmod +x ./uruntime2appimage

          # Ensure AppDir is clean
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"

          # Detect the installed executable to pass to quick-sharun:
          # Common install path: /usr/bin/transistor (or similar).
          BIN="$(find "$STAGE_ROOT/usr/bin" -maxdepth 1 -type f -executable | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "Could not find executable in $STAGE_ROOT/usr/bin"
            exit 1
          fi

          # Fix expected absolute paths by temporarily overlaying stage into system paths (without sudo):
          # We invoke quick-sharun using stage-prefixed absolute paths; it will bundle from there.
          # Ensure quick-sharun sees the binary at that path.
          if [ ! -f "$BIN" ]; then
            echo "Binary not found: $BIN"
            exit 1
          fi

          echo "Using binary: $BIN"
          echo "Using ICON: $ICON"
          echo "Using DESKTOP: $DESKTOP"

          # quick-sharun bundling:
          # Also pass likely dlopen libraries if the build uses them (optional; script can autodetect).
          # If you know exact extra libs, add them to the list.
          export DEPLOY_OPENGL=1
          export DEPLOY_VULKAN=1
          export DEPLOY_PIPEWIRE=1

          # Put a copy of stage into a known location for quick-sharun path resolution
          # (quick-sharun will copy needed libs into the AppDir).
          ./quick-sharun "$BIN"

          # Generate AppImage with uruntime2appimage
          ./uruntime2appimage

          echo "Output files:"
          ls -la "${OUT_DIR}" | tail -n 200

      - name: Collect AppImage artifacts
        run: |
          set -euxo pipefail
          ls -ლა dist
          APPIMAGE="$(find dist -maxdepth 1 -type f -name "*.AppImage" | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage produced"
            exit 1
          fi
          echo "APPIMAGE=$APPIMAGE" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  build-x86_64-release:
    name: Build x86_64 AppImage (release publish)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-x86_64]
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ARCH: x86_64

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-x86_64
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
